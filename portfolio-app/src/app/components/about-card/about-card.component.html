<div class="about-card">
  <div class="card-header">
    <div class="header-text">
      <h2 class="about-title">{{ title() }} <span>{{ subtitleSpan() }}</span></h2>
      <p class="subtitle">{{ subtitle() }}</p>
    </div>
  </div>

  <div class="card-body">
    <p *ngFor="let paragraph of paragraphs()">{{ paragraph }}</p>
  </div>

  <div class="card-actions" *ngIf="resumeLink()">
    <a [href]="resumeLink()" target="_blank" class="resume-btn">
      Download My Resume
    </a>
  </div>
</div>
